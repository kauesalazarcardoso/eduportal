{% extends "base.html" %}
{% block titulo %}Meu perfil{% endblock %}
{% block conteudo %}
<div class="topo"><div><h1>Meu perfil</h1><p class="sub">{{ usuario.email }} · {{ PERFIS[usuario.perfil] }}</p></div></div>
<form class="cartao" method="post">
  <div class="campos">
    <div class="campo inteiro"><label>Nome</label><input name="nome" value="{{ usuario.nome }}" required></div>
    <div class="campo"><label>Senha atual</label><input name="senha_atual" type="password"></div>
    <div class="campo"><label>Nova senha (deixe em branco para manter)</label><input name="senha_nova" type="password"></div>
  </div>
  <div class="botoes"><button class="btn">Salvar</button></div>
</form>
{% endblock %}
