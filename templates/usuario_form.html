{% extends "base.html" %}
{% block titulo %}Usuário{% endblock %}
{% block conteudo %}
<div class="topo"><div><h1>{{ 'Editar usuário' if usuario else 'Novo usuário' }}</h1><p class="sub">Alunos, professores e administradores</p></div></div>
<form class="cartao" method="post">
  <div class="campos">
    <div class="campo"><label>Nome</label><input name="nome" value="{{ usuario.nome if usuario else request.form.nome }}" required></div>
    <div class="campo"><label>E-mail</label><input name="email" type="email" value="{{ usuario.email if usuario else request.form.email }}" required></div>
    <div class="campo"><label>Perfil</label><select name="perfil">{% for k, v in PERFIS.items() %}<option value="{{ k }}" {{ 'selected' if usuario and usuario.perfil == k }}>{{ v }}</option>{% endfor %}</select></div>
    <div class="campo"><label>Senha {{ '(deixe em branco para manter)' if usuario }}</label><input name="senha" type="password"></div>
  </div>
  <div class="botoes"><button class="btn">Salvar</button><a class="btn claro" href="{{ url_for('usuarios') }}">Cancelar</a></div>
</form>
{% endblock %}
