{% extends "base.html" %}
{% block titulo %}Turma{% endblock %}
{% block conteudo %}
<div class="topo"><h1>{{ 'Editar turma' if turma else 'Nova turma' }}</h1></div>
<form class="cartao" method="post">
  <div class="campos">
    <div class="campo inteiro"><label>Nome</label><input name="nome" value="{{ turma.nome if turma }}" placeholder="Ex.: 3º Ano C" required></div>
    <div class="campo"><label>Ano letivo</label><input name="ano" type="number" value="{{ turma.ano if turma else 2026 }}" required></div>
    <div class="campo"><label>Turno</label><select name="turno">{% for t in turnos %}<option {{ 'selected' if turma and turma.turno == t }}>{{ t }}</option>{% endfor %}</select></div>
  </div>
  <div class="botoes"><button class="btn">Salvar</button><a class="btn claro" href="{{ url_for('turmas') }}">Cancelar</a></div>
</form>
{% endblock %}
