{% extends "base.html" %}
{% block titulo %}Disciplina{% endblock %}
{% block conteudo %}
<div class="topo"><h1>{{ 'Editar disciplina' if disciplina else 'Nova disciplina' }}</h1></div>
<form class="cartao" method="post">
  <div class="campos">
    <div class="campo"><label>Nome</label><input name="nome" value="{{ disciplina.nome if disciplina }}" required></div>
    <div class="campo"><label>Carga horária (horas)</label><input name="carga_horaria" type="number" value="{{ disciplina.carga_horaria if disciplina else 60 }}" required></div>
    <div class="campo"><label>Turma</label><select name="turma_id">{% for t in turmas %}<option value="{{ t.id }}" {{ 'selected' if disciplina and disciplina.turma_id == t.id }}>{{ t.nome }}</option>{% endfor %}</select></div>
    <div class="campo"><label>Professor</label><select name="professor_id"><option value="">— sem professor —</option>{% for p in professores %}<option value="{{ p.id }}" {{ 'selected' if disciplina and disciplina.professor_id == p.id }}>{{ p.nome }}</option>{% endfor %}</select></div>
  </div>
  <div class="botoes"><button class="btn">Salvar</button><a class="btn claro" href="{{ url_for('disciplinas') }}">Cancelar</a></div>
</form>
{% endblock %}
